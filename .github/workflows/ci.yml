name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} native toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: |
          cc -o nob nob.c
          ./nob verify-header
          ./nob test
          ./nob describe

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl.exe /std:c11 /W4 /WX /wd4702 /wd4709 /nologo /D_CRT_SECURE_NO_WARNINGS /Fe:nob.exe nob.c
          .\nob.exe verify-header
          .\nob.exe test
          .\nob.exe describe

  linux-compilers:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cpp_compiler: g++
          - compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cpp_compiler }}
        run: |
          "$CC" -o nob nob.c
          ./nob clean
          ./nob verify-header
          ./nob test

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run sanitizer suite
        run: |
          cc -o nob nob.c
          ./nob verify-header
          ./nob header
          for suite in workspace preprocessing_tokens macro_directives macro_environment \
                       macro_expansion preprocessor lexing syntax c_analysis rewriter artifacts; do
            cc -std=c11 -Wall -Wextra -Wpedantic \
               -fsanitize=address,undefined -fno-omit-frame-pointer \
               -Ibuild/generated -I. \
               -o "build/noc-test-${suite}-sanitize" "tests/test_${suite}.c"
            ASAN_OPTIONS=detect_leaks=1 "./build/noc-test-${suite}-sanitize"
          done
          cc -std=c11 -Wall -Wextra -Wpedantic \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             -Iinclude -I. -o build/noc-test-modules-sanitize \
             tests/test_modules.c src/lexer.c src/source.c src/features.c \
             src/macro_directives.c src/preprocessor.c src/macro_environment.c \
             src/macro_expansion.c src/parser.c src/ast.c src/lower.c src/emit_c.c
          ASAN_OPTIONS=detect_leaks=1 ./build/noc-test-modules-sanitize
          cc -std=c11 -Wall -Wextra -Wpedantic \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             -Ibuild/generated -I. -o noc-fuzz-sanitize tests/fuzz_noc.c
          ASAN_OPTIONS=detect_leaks=1 ./noc-fuzz-sanitize

  fuzz:
    name: Linux Clang libFuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run bounded fuzz campaign
        run: |
          cc -o nob nob.c
          ./nob verify-header
          ./nob header
          clang -std=c11 -Wall -Wextra -Wpedantic \
                -DNOC_LIBFUZZER -fsanitize=fuzzer,address,undefined \
                -fno-omit-frame-pointer -Ibuild/generated -I. \
                -o noc-fuzz tests/fuzz_noc.c
          ASAN_OPTIONS=detect_leaks=1 ./noc-fuzz -runs=20000 -max_len=2048
