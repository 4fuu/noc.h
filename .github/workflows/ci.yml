name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-grammar-regeneration:
    name: ${{ matrix.os }} grammar regeneration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce patched C grammar and private payload
        run: python tools/vendor_tree_sitter.py --check

  vendored-parser:
    name: Authenticated vendored parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce and audit Tree-sitter payload
        run: |
          set -o pipefail
          python3 tools/vendor_tree_sitter.py --check
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
             -DTREE_SITTER_FEATURE_WASM=1 \
             -DTREE_SITTER_HIDE_SYMBOLS=consumer_flag \
             -c third_party/tree-sitter/tree_sitter.c \
             -o tree_sitter_vendor.o
          nm -g --defined-only tree_sitter_vendor.o > global-symbols
          awk 'NF && $NF !~ /^noc__vendor_/ {print $NF}' global-symbols \
            > unexpected-global-symbols
          test ! -s unexpected-global-symbols
          nm --defined-only tree_sitter_vendor.o > file-symbols
          awk 'NF && $NF !~ /^(noc__vendor_.*|Noc__Vendor_.*|NOC__VENDOR_.*|__PRETTY_FUNCTION__(\.[0-9]+)?|empty_state\.[0-9]+|language\.[0-9]+|map\.[0-9]+)$/ {print $NF}' \
            file-symbols > unexpected-file-symbols
          test ! -s unexpected-file-symbols
          readelf -Ws tree_sitter_vendor.o | \
            awk '($5 == "GLOBAL" && $7 != "UND" && $6 != "HIDDEN") || ($7 == "UND" && $6 == "HIDDEN") {print $8}' \
            > unexpected-visible-symbols
          test ! -s unexpected-visible-symbols

  native:
    name: ${{ matrix.os }} native toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: |
          cc -o nob nob.c
          ./nob verify-header
          ./nob test
          ./nob describe

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl.exe /std:c11 /W4 /WX /wd4702 /wd4709 /nologo /D_CRT_SECURE_NO_WARNINGS /Fe:nob.exe nob.c
          .\nob.exe verify-header
          .\nob.exe test
          .\nob.exe describe

  linux-compilers:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cpp_compiler: g++
          - compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cpp_compiler }}
        run: |
          "$CC" -o nob nob.c
          ./nob clean
          ./nob verify-header
          ./nob test

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run sanitizer suite
        run: |
          cc -o nob nob.c
          ./nob verify-header
          ./nob header
          common_flags="-std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer"
          cc $common_flags -DNOC_IMPLEMENTATION -x c -c release/noc.h \
             -o build/noc-implementation-sanitize.o
          for suite in workspace preprocessing_tokens macro_directives macro_invocations \
                       macro_environment macro_environment_clone \
                       macro_expansion logical_source \
                       logical_source_lifecycle logical_source_queries \
                       logical_source_fragments logical_source_fragments_lifecycle \
                       preprocessor_logical_source \
                       preprocessor_logical_source_lifecycle \
                       function_macro_expansion \
                       variadic_macro_expansion macro_stringification macro_token_paste \
                       macro_builtins configured_builtins preprocessor_expressions \
                       conditional_groups pragma_once include_guard \
                       include_guard_structural \
                       include_control_queries include_operands include_resolver \
                       include_expansion include_expansion_resolver \
                       include_graph include_graph_limits include_graph_queries \
                       translation_execution translation_control \
                       preprocessor lexing syntax c_analysis c_parse_tree \
                       c_parse_recovery c_parse_lifecycle c_parse_corpus \
                       c_parse_malformed_corpus c_parse_completion \
                       logical_c_parse logical_c_parse_lifecycle \
                       logical_c_ast logical_c_ast_lifecycle \
                       logical_c_ast_completion \
                       c_ast c_ast_details \
                       c_ast_c11 c_ast_c11_constructs c_ast_declarators \
                       c_ast_completion c_ast_queries c_ast_recovery \
                       tree_sitter_coexistence \
                       rewriter defer templates ownership artifacts; do
            cc $common_flags -Ibuild/generated -Iinclude -I. \
               -o "build/noc-test-${suite}-sanitize" "tests/test_${suite}.c" \
               build/noc-implementation-sanitize.o
            ASAN_OPTIONS=detect_leaks=1 "./build/noc-test-${suite}-sanitize"
          done
          cc $common_flags -Ibuild/generated -Iinclude -I. \
             -o build/noc-test-release-header-runtime-sanitize \
             tests/test_release_header_runtime.c
          ASAN_OPTIONS=detect_leaks=1 \
            ./build/noc-test-release-header-runtime-sanitize
          cc $common_flags -Iinclude -I. -o build/noc-test-modules-sanitize \
             tests/test_modules.c third_party/tree-sitter/tree_sitter.c \
             src/lexer.c src/source.c src/features.c \
             src/macro_directives.c src/preprocessor.c src/macro_invocations.c \
             src/macro_environment.c src/macro_expansion.c src/logical_source.c \
             src/conditional.c \
             src/conditional_groups.c src/include_control.c src/include_resolver.c \
             src/include_expansion.c src/include_graph.c src/translation.c \
             src/parser.c src/ast.c src/c_parse.c src/logical_c_parse.c \
             src/logical_ast.c src/types.c src/semantic.c src/cfg.c \
             src/lower.c src/emit_c.c
          ASAN_OPTIONS=detect_leaks=1 ./build/noc-test-modules-sanitize
          cc $common_flags -Ibuild/generated -Iinclude -I. \
             -o noc-fuzz-sanitize tests/fuzz_noc.c \
             build/noc-implementation-sanitize.o
          ASAN_OPTIONS=detect_leaks=1 ./noc-fuzz-sanitize
          cc $common_flags -Ibuild/generated -Iinclude -I. \
             -o noc-c-parse-fuzz-sanitize tests/fuzz_c_parser.c \
             build/noc-implementation-sanitize.o
          ASAN_OPTIONS=detect_leaks=1 ./noc-c-parse-fuzz-sanitize

  fuzz:
    name: Linux Clang libFuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run bounded fuzz campaign
        run: |
          cc -o nob nob.c
          ./nob verify-header
          ./nob header
          clang -std=c11 -Wall -Wextra -Wpedantic \
                -Werror -DNOC_IMPLEMENTATION -DNOC_LIBFUZZER \
                -fsanitize=fuzzer,address,undefined \
                -fno-omit-frame-pointer -include build/generated/noc.h \
                -Iinclude -I. \
                -o noc-fuzz tests/fuzz_noc.c
          ASAN_OPTIONS=detect_leaks=1 ./noc-fuzz -runs=20000 -max_len=2048
          clang -std=c11 -Wall -Wextra -Wpedantic \
                -Werror -DNOC_IMPLEMENTATION -DNOC_LIBFUZZER \
                -fsanitize=fuzzer,address,undefined \
                -fno-omit-frame-pointer -include build/generated/noc.h \
                -Iinclude -I. \
                -o noc-c-parse-fuzz tests/fuzz_c_parser.c
          ASAN_OPTIONS=detect_leaks=1 \
            ./noc-c-parse-fuzz -runs=20000 -max_len=4096
